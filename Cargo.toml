[package]
name = "perfetto-mcp-rs"
version = "0.14.3"
edition = "2021"
description = "MCP server for Perfetto trace analysis"
authors = ["The perfetto-mcp-rs Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tooluse-labs/perfetto-mcp-rs"
homepage = "https://github.com/tooluse-labs/perfetto-mcp-rs"
readme = "README.md"
keywords = ["perfetto", "mcp", "trace", "tracing", "claude"]
categories = ["development-tools::profiling", "command-line-utilities"]

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
which = "7"
lru = "0.12"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"

[build-dependencies]
prost-build = "0.13"
